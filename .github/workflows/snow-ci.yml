name: Snow Leopard CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: snow-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-snow
      - name: Unit tests
        shell: bash
        run: |
          bash ./gradlew testGithubDebugUnitTest --tests '*domain.guard.*' --tests '*feature.guard.*' --tests '*ScheduleTermBoundaryTest' --tests '*ScheduleAdjustmentsTest' --tests '*IcsScheduleCodecTest' --tests '*WakeUpImportSessionTest' --tests '*ScheduleImportCustomCourseTest' -Psleepdown.miuixSourcePath="$GITHUB_WORKSPACE/.ci/miuix" -Psleepdown.useMavenMirrors=false --no-daemon --max-workers=2 --stacktrace
      - name: Lint and installable debug APK
        run: bash ./gradlew lintGithubDebug assembleGithubDebug -Psleepdown.miuixSourcePath="$GITHUB_WORKSPACE/.ci/miuix" -Psleepdown.useMavenMirrors=false --no-daemon --max-workers=2 --stacktrace
      - name: Collect APK checksum
        run: sha256sum app/build/outputs/apk/github/debug/*.apk > debug-apk-sha256.txt
      - name: Verify release shrinker without signing
        run: bash ./gradlew minifyGithubReleaseWithR8 -Psleepdown.miuixSourcePath="$GITHUB_WORKSPACE/.ci/miuix" -Psleepdown.useMavenMirrors=false --no-daemon --max-workers=2 --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snow-leopard-debug-and-reports
          path: |
            app/build/outputs/apk/github/debug/*.apk
            debug-apk-sha256.txt
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [30, 31, 34, 35, 36]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-snow
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          script: bash ./gradlew connectedGithubDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.xiaomanjun.sleepdownschedule.feature.guard.GuardPersistenceInstrumentedTest -Psleepdown.miuixSourcePath="$GITHUB_WORKSPACE/.ci/miuix" -Psleepdown.useMavenMirrors=false --no-daemon --max-workers=2 --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-api-${{ matrix.api }}
          path: app/build/reports/androidTests/

